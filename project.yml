# XcodeGen spec for the shipping app. Generate the .xcodeproj with:
#     xcodegen generate
# (the .xcodeproj is gitignored — this file is the source of truth.)
#
# One multiplatform app target → iPhone, iPad, and Mac from a single codebase,
# linking the local TTMCore Swift package. The app/ SPM package stays usable for
# fast headless iteration (swift build); this Xcode target is what ships to the
# App Store.
name: TrackTheMoney
options:
  bundleIdPrefix: money.trackthe
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
packages:
  TTMCore:
    path: TTMCore
targets:
  TrackTheMoney:
    type: application
    supportedDestinations: [iOS, macOS]   # iPhone + iPad (iOS) and native Mac
    sources:
      - path: app/Sources/TrackTheMoney
    dependencies:
      - package: TTMCore
        product: TTMCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: money.trackthe.app
        PRODUCT_NAME: TrackTheMoney
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Track The Money
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.finance"
        # Without a launch-screen entry the iOS 26+ SDK runs the app in a
        # 320x480 legacy-compatibility window (letterboxed, rows under the tab
        # bar). An empty generated UILaunchScreen opts into full-screen layout.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        # Mac: native AppKit-backed SwiftUI (not Catalyst).
        SUPPORTS_MACCATALYST: NO
    # Partial plist merged into the generated one: it declares the backup file
    # type so Files/Finder show .ttmbackup as ours (docs/plans/DATA_PORTABILITY_PLAN.md
    # D2). Generated by xcodegen — gitignored, never hand-edited.
    info:
      path: app/TrackTheMoney-Info.plist
      properties:
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: money.trackthe.backup
            UTTypeDescription: Track The Money Backup
            UTTypeConformsTo: [public.database, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [ttmbackup]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Track The Money Backup
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes: [money.trackthe.backup]
  TrackTheMoneyUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS, macOS]   # UI automation on the iOS Simulator + native Mac
    sources:
      - path: app/UITests
    dependencies:
      - target: TrackTheMoney
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: money.trackthe.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TEST_TARGET_NAME: TrackTheMoney
schemes:
  TrackTheMoney:
    build:
      targets:
        TrackTheMoney: all
    test:
      targets:
        - TrackTheMoneyUITests
